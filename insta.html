<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>KN Admin Panel</title>

<!-- Supabase JS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    background:#0f172a;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    color:#f8fafc;
}

.app{
    width:100%;
    height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

/* ================= ADMIN LOGIN PAGE ================= */

.admin-login-box {
    background: #1e293b;
    border: 1px solid rgba(56, 189, 248, 0.3);
    border-radius: 12px;
    padding: 25px;
    width: 100%;
    max-width: 340px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}

.admin-box-title {
    font-size: 16px;
    font-weight: bold;
    color: #38bdf8;
    margin-bottom: 20px;
    text-align: center;
    letter-spacing: 0.5px;
}

.admin-input {
    width: 100%;
    height: 38px;
    background: #0f172a;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    color: #fff;
    padding: 0 12px;
    font-size: 11px;
    margin-bottom: 12px;
    outline: none;
}

.admin-input:focus {
    border-color: #38bdf8;
}

.admin-btn {
    width: 100%;
    height: 38px;
    background: #0284c7;
    border: none;
    border-radius: 6px;
    color: white;
    font-weight: bold;
    font-size: 11px;
    cursor: pointer;
    margin-top: 5px;
    transition: background 0.2s;
}

.admin-btn:hover {
    background: #0ea5e9;
}

.admin-login-msg {
    font-size: 10px;
    color: #ef4444;
    text-align: center;
    margin-top: 10px;
    min-height: 14px;
}

/* ================= ADMIN DASHBOARD ================= */

.admin-dashboard-box {
    background: #1e293b;
    border: 1px solid rgba(56, 189, 248, 0.3);
    border-radius: 12px;
    padding: 20px;
    width: 100%;
    max-width: 500px;
    height: 85vh;
    display: none;
    flex-direction: column;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}

.admin-dashboard-box.active {
    display: flex;
}

.dashboard-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 10px;
}

.logout-btn {
    background: #ef4444;
    width: auto;
    padding: 6px 12px;
    height: auto;
    font-size: 10px;
    margin-top: 0;
}

.logout-btn:hover {
    background: #dc2626;
}

.admin-table-wrapper {
    flex: 1;
    overflow-y: auto;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
}

.admin-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 10px;
    text-align: left;
}

.admin-table th, .admin-table td {
    padding: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
}

.admin-table th {
    background: #0f172a;
    color: #38bdf8;
    position: sticky;
    top: 0;
}

.del-btn {
    background: #ef4444;
    color: white;
    border: none;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 9px;
}

.del-btn:hover {
    background: #dc2626;
}
</style>
</head>

<body>

<div class="app">
    <!-- ADMIN LOGIN SECTION -->
    <div class="admin-login-box" id="adminLoginBox">
        <div class="admin-box-title">KN Admin Authentication</div>
        <input id="adminUser" class="admin-input" type="text" placeholder="Admin ID" autocomplete="off">
        <input id="adminPass" class="admin-input" type="password" placeholder="Password" autocomplete="off">
        <button class="admin-btn" onclick="verifyAdmin()">Login to Dashboard</button>
        <div class="admin-login-msg" id="adminLoginMsg"></div>
    </div>

    <!-- ADMIN DASHBOARD SECTION -->
    <div class="admin-dashboard-box" id="adminDashboardBox">
        <div class="dashboard-header">
            <div class="admin-box-title" style="margin-bottom:0;">Registered Users Database</div>
            <button class="admin-btn logout-btn" onclick="logoutAdmin()">Logout</button>
        </div>
        <div class="admin-table-wrapper">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>ID / User Info</th>
                        <th>Nickname</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody">
                    <!-- Dynamic Records -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
  const SUPABASE_URL = 'https://qqhbtednfvmywrrirvza.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_NKAX_JLpojUwVJymeQ3AIQ_ScS7-Tp1';

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function verifyAdmin(){
    const user = document.getElementById("adminUser").value.trim();
    const pass = document.getElementById("adminPass").value.trim();
    const msg = document.getElementById("adminLoginMsg");

    if(user === "hridi" && pass === "bolti"){
        document.getElementById("adminLoginBox").style.display = "none";
        document.getElementById("adminDashboardBox").classList.add("active");
        loadAdminDashboard();
    } else {
        msg.textContent = "Invalid Admin ID or Password!";
    }
}

async function loadAdminDashboard(){
    const tbody = document.getElementById("adminTableBody");
    tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;">Loading database...</td></tr>`;

    const { data, error } = await supabaseClient
        .from('user_data')
        .select('*');

    if(error){
        console.error("Supabase Error:", error);
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#ef4444;">Failed to fetch records</td></tr>`;
        return;
    }

    if(!data || data.length === 0){
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;">No records found</td></tr>`;
        return;
    }

    tbody.innerHTML = "";
    data.forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${row.user_id}</td>
            <td>${row.nickname || 'N/A'}</td>
            <td><button class="del-btn" onclick="deleteUserRecord('${row.id}')">Delete</button></td>
        `;
        tbody.appendChild(tr);
    });
}

async function deleteUserRecord(rowId){
    if(!confirm("Are you sure you want to delete this record?")) return;

    const { error } = await supabaseClient
        .from('user_data')
        .delete()
        .eq('id', rowId);

    if(error){
        alert("Failed to delete record.");
        return;
    }

    loadAdminDashboard();
}

function logoutAdmin(){
    document.getElementById("adminUser").value = "";
    document.getElementById("adminPass").value = "";
    document.getElementById("adminLoginMsg").textContent = "";
    document.getElementById("adminDashboardBox").classList.remove("active");
    document.getElementById("adminLoginBox").style.display = "block";
}
</script>
</body>
</html>
